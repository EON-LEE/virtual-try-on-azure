name: Application checks
on:
  pull_request:
  push:
    branches: [main, 'eonlee-microsoft-*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/requirements.txt
      - run: python -m pip install -r experiments/requirements.txt
      - run: python -m unittest discover -s experiments -p 'test_*.py'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: mkdir -p sample-images && docker build -t try-on-studio:test .
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null
